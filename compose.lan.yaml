# Optional: only Web is exposed on the computer's Wi-Fi IPv4 address.
services:
  web:
    ports:
      - "${GOVAID_LAN_IP:?Set GOVAID_LAN_IP to the Wi-Fi IPv4 address}:${WEB_PORT:-13028}:3000"
  api:
    environment:
      ALLOWED_ORIGINS: http://127.0.0.1:${WEB_PORT:-13028},http://localhost:${WEB_PORT:-13028},http://${GOVAID_LAN_IP}:${WEB_PORT:-13028}
